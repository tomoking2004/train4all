name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checking out and running the suite is all this needs; the default token can do more.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every combination reports, rather than the matrix stopping at the first failure:
      # which of them broke is the question a matrix exists to answer.
      fail-fast: false
      matrix:
        # Kept equal to pyproject's `Programming Language :: Python` classifiers,
        # which `test_the_ci_matrix_matches_the_python_classifiers` pins.
        python-version: ["3.12", "3.13"]
        # `Operating System :: OS Independent` is a claim about both, and `system.py`
        # branches on `sys.platform`: only a runner of that platform reads its branch.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The CPU wheels first, and by name: on Linux the default index would pull the
        # CUDA build — gigabytes of driver payload no runner here has a GPU to use.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        # The package ships `py.typed`; this is what keeps that claim honest, on each
        # version rather than once, since what a checker infers can differ between them.
        run: mypy

      - name: Test
        # `--cov` and not a bare `pytest`: the coverage floor is configured to be
        # enforced where the whole suite runs, and this is that place.
        run: pytest --cov
