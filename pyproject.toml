[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "train4all"
version = "0.11.0"
description = "A minimal, extensible training framework for PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "tomoking2004" }]
keywords = ["pytorch", "deep-learning", "training", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib",
    "numpy",
    "nvidia-ml-py",
    "psutil",
    "torch>=2.0",
    "tqdm",
]

[project.optional-dependencies]
# The two stub packages are what make `py.typed` above more than a claim: without
# them the annotations are checked against `Any` wherever psutil or tqdm appears.
dev = ["mypy", "pytest", "pytest-cov", "ruff", "types-psutil", "types-tqdm"]

[project.urls]
Repository = "https://github.com/tomoking2004/train4all"

[tool.setuptools.packages.find]
# Without this the flat layout also ships `tests` as a top-level package.
include = ["train4all*"]

[tool.setuptools.package-data]
# Two things that are not Python but must travel with it:
#   py.typed  — the PEP 561 marker, without which every annotation in the package
#               is invisible to a downstream type checker, and the `Typing :: Typed`
#               classifier above would be a claim nothing backs.
train4all = ["py.typed"]
# The stylesheet and the shell the live dashboard is written into. An installed
# train4all reads them beside its engine; left out, `use_dashboard=True` would
# fail on a user's first run rather than here.
"train4all.dashboard" = ["*.css", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["train4all"]

[tool.coverage.report]
# The floor is a property of the whole suite, so it is enforced where the whole
# suite runs — `pytest --cov` — and not on every invocation. In `addopts` it would
# also fire on a focused run, where a single file cannot reach 80% of the package
# and the failure says nothing about the code under test.
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
# The version floor is stated once, in `requires-python`; unlike ruff, mypy does not
# read it, so it is forwarded here rather than written independently.
python_version = "3.12"
# The suite is checked too: the tests are what read the public API most heavily, so a
# signature they misuse is worth catching here rather than in an assertion message.
files = ["train4all", "tests"]
# Bodies are checked everywhere, which mypy does not do by default inside a function
# that carries no annotations. That default is what had kept the suite unchecked even
# where it was already in `files`: `def test_x(trainer)` is the fixture request pytest
# reads, and annotating several hundred of those would restate what the fixture already
# declares. So the tests keep their signatures and still fail here when they misread the
# API — while `[[tool.mypy.overrides]]` below holds the *package* to the stricter rule.
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The package ships `py.typed`, so what a downstream checker sees is exactly what is
# annotated here. These two turn "annotated" into something enforced rather than
# optional: every function must have annotations, and none may quietly become `Any`.
# The tests make no such promise to anyone, which is why this is scoped and not global.
module = ["train4all.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# NVML's Python binding ships neither stubs nor `py.typed`. It is reached through one
# guarded import in `system.py`, so the untyped surface stops there.
module = ["pynvml"]
ignore_missing_imports = true

[tool.ruff]
# The target version is not repeated here: ruff reads it from `requires-python`, so
# raising the floor there cannot leave the linter behind on an older dialect.
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "ARG", "PTH", "RUF"]
ignore = [
    # The 14 lifecycle hooks are deliberately empty no-ops on an abstract class:
    # making them abstract would force every subclass to implement all 14, which
    # is the opposite of the design.
    "B027",
    # Console output and docstrings use real typography on purpose — box rules,
    # en dashes, and × in "Σ(metric × weight)".
    "RUF001",
    "RUF002",
    # `import torch.nn.functional as F` is the universal PyTorch convention.
    "N812",
]

[tool.ruff.lint.per-file-ignores]
# A test that overrides a lifecycle hook must carry the framework's signature
# whether or not that test's body reads every argument. Renaming them to `_x`
# would corrupt the very signatures these tests exist to demonstrate.
"tests/*" = ["ARG002"]
