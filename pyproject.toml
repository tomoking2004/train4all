[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "train4all"
version = "0.4.0"
description = "A minimal, extensible training framework for PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["pytorch", "deep-learning", "training", "machine-learning"]
dependencies = [
    "matplotlib",
    "numpy",
    "nvidia-ml-py",
    "psutil",
    "torch>=2.0",
    "tqdm",
    "wmi; platform_system == 'Windows'",
]

[project.urls]
Repository = "https://github.com/tomoking2004/train4all"

[tool.setuptools.packages.find]
where = ["."]
include = ["train4all*"]
